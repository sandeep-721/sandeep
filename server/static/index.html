<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal RAG</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0b0f14;
            color: #e8edf3;
        }

        .app {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }

        header {
            margin-bottom: 32px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        .subtitle {
            color: #8d99a8;
            margin: 0;
        }

        .search-panel {
            background: #111720;
            border: 1px solid #26303c;
            border-radius: 14px;
            padding: 20px;
        }

        textarea {
            width: 100%;
            min-height: 110px;
            resize: vertical;
            border: 1px solid #303b49;
            border-radius: 10px;
            background: #0b0f14;
            color: #e8edf3;
            padding: 14px;
            font: inherit;
            outline: none;
        }

        textarea:focus {
            border-color: #60758c;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 14px;
            gap: 16px;
        }

        button {
            border: 0;
            border-radius: 9px;
            padding: 11px 20px;
            background: #e8edf3;
            color: #0b0f14;
            font-weight: 600;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: default;
        }

        .developer-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #9ca8b6;
            font-size: 14px;
        }

        .status {
            margin-top: 16px;
            color: #8d99a8;
            min-height: 20px;
        }

        .results {
            margin-top: 28px;
            display: grid;
            gap: 14px;
        }

        .result {
            background: #111720;
            border: 1px solid #26303c;
            border-radius: 12px;
            padding: 18px;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 12px;
        }

        .rank {
            color: #8d99a8;
            font-size: 13px;
        }

        .score {
            color: #aeb9c6;
            font-size: 13px;
        }

        .source {
            font-weight: 600;
            word-break: break-all;
            margin-bottom: 10px;
        }

        .source-type {
            display: inline-block;
            font-size: 12px;
            padding: 4px 8px;
            border: 1px solid #303b49;
            border-radius: 999px;
            color: #9ca8b6;
            margin-bottom: 12px;
        }

        .content {
            color: #c7d0da;
            white-space: pre-wrap;
            line-height: 1.55;
            font-size: 14px;
        }

        .developer {
            display: none;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid #26303c;
            color: #8d99a8;
            font-size: 12px;
            line-height: 1.7;
        }

        .developer.visible {
            display: block;
        }

        .empty {
            color: #8d99a8;
            text-align: center;
            padding: 40px 0;
        }

        @media (max-width: 700px) {
            .app {
                padding: 24px 16px 60px;
            }

            .controls {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
<div class="app">

    <header>
        <h1>Universal RAG</h1>
        <p class="subtitle">
            Search across your knowledge, code, documentation, and projects.
        </p>
    </header>

    <section class="search-panel">
        <textarea
            id="query"
            placeholder="Ask anything about your indexed data..."
        ></textarea>

        <div class="controls">
            <label class="developer-toggle">
                <input type="checkbox" id="developerMode">
                Developer Mode
            </label>

            <button id="searchButton" onclick="searchRAG()">
                Search
            </button>
        </div>

        <div id="status" class="status"></div>
    </section>

    <section id="results" class="results">
        <div class="empty">
            Ask a question to search your knowledge base.
        </div>
    </section>

</div>

<script>
    const queryInput = document.getElementById("query");
    const searchButton = document.getElementById("searchButton");
    const status = document.getElementById("status");
    const results = document.getElementById("results");
    const developerMode = document.getElementById("developerMode");

    queryInput.addEventListener("keydown", function(event) {
        if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
            searchRAG();
        }
    });

    function escapeHTML(value) {
        const div = document.createElement("div");
        div.textContent = value ?? "";
        return div.innerHTML;
    }

    function renderResults(data) {
        results.innerHTML = "";

        if (!data.results || data.results.length === 0) {
            results.innerHTML = '<div class="empty">No results found.</div>';
            return;
        }

        const developer = developerMode.checked;

        data.results.forEach((result, index) => {
            const payload = result.payload || {};

            const source =
                payload.source ||
                payload.path ||
                "Unknown source";

            const sourceType =
                payload.source_type ||
                "unknown";

            const content =
                payload.text ||
                "No content available.";

            const card = document.createElement("article");
            card.className = "result";

            card.innerHTML = `
                <div class="result-header">
                    <span class="rank">Result ${index + 1}</span>
                    <span class="score">
                        ${Number(result.final_rerank_score ?? 0).toFixed(4)}
                    </span>
                </div>

                <div class="source">${escapeHTML(source)}</div>

                <div class="source-type">
                    ${escapeHTML(sourceType)}
                </div>

                <div class="content">${escapeHTML(content)}</div>

                <div class="developer ${developer ? "visible" : ""}">
                    <strong>Developer diagnostics</strong><br>
                    RRF rank: ${result.rrf_rank ?? "—"}<br>
                    Dense rank: ${result.dense_rank ?? "—"}<br>
                    Sparse rank: ${result.sparse_rank ?? "—"}<br>
                    Reranker score: ${Number(result.rerank_score ?? 0).toFixed(4)}<br>
                    Normalized reranker score: ${Number(result.rerank_normalized_score ?? 0).toFixed(4)}<br>
                    Lexical score: ${Number(result.lexical_score ?? 0).toFixed(4)}<br>
                    Answer evidence: ${Number(result.answer_evidence_score ?? 0).toFixed(4)}<br>
                    Structural score: ${Number(result.structural_score ?? 0).toFixed(4)}<br>
                    Source authority: ${Number(result.source_authority ?? 0).toFixed(2)}
                </div>
            `;

            results.appendChild(card);
        });
    }

    async function searchRAG() {
        const query = queryInput.value.trim();

        if (!query) {
            status.textContent = "Please enter a question.";
            return;
        }

        searchButton.disabled = true;
        status.textContent = "Searching...";
        results.innerHTML = "";

        try {
            const response = await fetch("/search", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    query: query,
                    limit: 5
                })
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const data = await response.json();

            renderResults(data);

            status.textContent =
                `${data.results?.length ?? 0} results returned.`;

        } catch (error) {
            results.innerHTML =
                '<div class="empty">Search failed.</div>';

            status.textContent =
                error.message || "Search failed.";
        } finally {
            searchButton.disabled = false;
        }
    }
</script>

</body>
</html>
