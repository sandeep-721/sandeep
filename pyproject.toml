[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-rag"
version = "0.1.0"
description = "General-purpose hybrid RAG system with dense retrieval, BM25, RRF, and Qwen reranking"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.15,<2",
    "bitsandbytes>=0.50,<1",
    "huggingface-hub>=1.31,<2",
    "numpy>=2.4,<3",
    "python-dotenv>=1.2,<2",
    "qdrant-client>=1.19,<2",
    "rank-bm25>=0.2,<1",
    "scikit-learn>=1.9,<2",
    "sentence-transformers>=6,<7",
    "torch>=2.11,<3",
    "transformers>=5.17,<6",
    "tree-sitter>=0.26,<1",
    "tree-sitter-language-pack>=1.11,<2",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = [
    "config*",
    "embeddings*",
    "ingestion*",
    "metadata*",
    "retrieval*",
    "reranking*",
    "generation*",
    "server*",
]
